name: Check and publish course

# Проверки запускаются на каждый push и pull request в main.
# Публикация — только вручную (Run workflow → publish = true) и только после отдельного «да» Алексея.
# Сайт раздаётся из ветки gh-pages (Settings → Pages: Deploy from a branch → gh-pages → /),
# поэтому публикация копирует содержимое dist/ в эту ветку; настройки Pages менять не нужно.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish dist/ to gh-pages — only after explicit approval from Aleksey'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Publish dist/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          enable_jekyll: false
          commit_message: 'Publish course from main ${{ github.sha }}'
